<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fetch API CRUD Practice</title>
  <link rel="stylesheet" href="Q1_crud.css">
  <script src="Q1_crud.js" defer></script>
</head>
<body>
  <header class="page-header">
    <h1>Fetch API CRUD Practice</h1>
    <p class="methods">GET <span>•</span> POST <span>•</span> PUT <span>•</span> PATCH <span>•</span> DELETE</p>
  </header>

  <main class="container">
    <section class="panel">
      <h2>Add Post</h2>
      <form id="postForm">
        <label for="postTitle">Post title</label>
        <input id="postTitle" name="title" type="text" placeholder="Enter post title" required>

        <label for="userId">User ID</label>
        <input id="userId" name="userId" type="number" min="1" value="1" required>

        <label for="postBody">Post content</label>
        <textarea id="postBody" name="body" rows="4" placeholder="Write your post..." required></textarea>

        <div class="button-row">
          <button type="submit">Add Post (POST)</button>
          <button type="button" id="reloadButton" class="secondary">Reload Posts (GET)</button>
        </div>
      </form>
      <p id="message" class="message" role="status">Ready.</p>
      <p id="statusLog" class="status-log">HTTP status: —</p>
    </section>

    <section>
      <div class="section-heading">
        <h2>Posts</h2>
        <span id="postCount">0 posts</span>
      </div>
      <div id="postsContainer" class="posts-grid">
        <p>Loading posts...</p>
      </div>
    </section>
  </main>
</body>
</html>
