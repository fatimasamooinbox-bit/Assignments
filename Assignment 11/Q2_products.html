<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Explorer</title>
  <link rel="stylesheet" href="Q2_products.css">
  <script src="Q2_products.js" defer></script>
</head>
<body>
  <header class="hero">
    <p class="eyebrow">ONLINE STORE</p>
    <h1>Product Explorer</h1>
    <p>Explore products and compare their prices.</p>
  </header>
  <main class="container">
    <p id="statusMessage" class="status" role="status">Loading products...</p>
    <p id="httpStatus" class="small">HTTP status: waiting...</p>
    <section id="productsGrid" class="grid" aria-label="Products"></section>
  </main>
</body>
</html>
